[package]
name = "ai-gui-auto-video-editor"
version = "19.59.0"
edition = "2024"
authors = ["DraconDev"]
description = "AGAVE - GUI + CLI AI-powered video editor: auto silence cutting, audio enhancement, scene detection, auto-reframe for content creators"
license = "AGPL-3.0-only"
repository = "https://github.com/DraconDev/ai-vid-editor"
homepage = "https://github.com/DraconDev/ai-vid-editor"
readme = "README.md"
keywords = ["video", "editor", "gui", "automation", "agave"]
categories = ["command-line-utilities", "gui", "multimedia::video"]
rust-version = "1.88"
exclude = [
    ".dracon/",
    ".ralph/",
    ".github/",
    "docs/",
    "plans/",
    "presets/",
    "benches/",
    "proptest-regressions/",
    "release/",
    "assets/Screenshot_20260319_124018.png",
    "todo.md",
    "justfile",
    "install.sh",
    "scripts/",
    "ai-gui-auto-video-editor.example.toml",
    "CHANGELOG.md",
    "CLA.md",
    "COMMERCIAL-LICENSE.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "flake.nix",
    "flake.lock",
    "deny.toml",
    ".gitattributes",
    ".gitignore",
]

[dependencies]
anyhow = "1.0.102"
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
clap = { version = "4.5.60", features = ["derive"], optional = true }
directories = "5.0"
hf-hub = "0.5.0"
image = "0.25"
indicatif = "0.17"
rand = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokenizers = "0.22.2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tract-onnx = "0.21"
walkdir = "2.5.0"
rustfft = "6.2"

# GUI dependencies (optional) - using egui with wgpu backend for better compatibility
eframe = { version = "0.31", optional = true, default-features = false, features = ["wgpu", "accesskit", "wayland", "x11"] }
egui = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }
chrono = { version = "0.4", optional = true }
notify-rust = { version = "4", optional = true }
ctrlc = { version = "3", optional = true }

[features]
default = ["cli", "gui"]
cli = ["clap", "notify-rust", "ctrlc"]
gui = ["eframe", "egui", "rfd", "chrono", "notify-rust", "cli"]

[dev-dependencies]
tempfile = "3.25.0"
proptest = "1.5.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parsers"
harness = false

[[bin]]
name = "ai-gui-auto-video-editor"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true
opt-level = 2
codegen-units = 1

[profile.dev]
opt-level = 1
