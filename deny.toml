# cargo-deny configuration for agave
# Run with: cargo deny check

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = [
    "RUSTSEC-2026-0105",  # core2 unmaintained (transitive via candle)
    "RUSTSEC-2025-0119",  # number_prefix unmaintained (transitive via tract-onnx)
    "RUSTSEC-2024-0436",  # paste unmaintained (transitive via candle)
    "RUSTSEC-2026-0049",  # rand unsound with custom logger (transitive, limited impact)
    "RUSTSEC-2026-0067",  # rustls-webpki CRL matching (transitive, limited impact)
    "RUSTSEC-2026-0068",  # rustls-webpki name constraints URI (transitive)
    "RUSTSEC-2026-0097",  # rustls-webpki wildcard name constraints (transitive)
    "RUSTSEC-2026-0098",  # rustls-webpki reachable panic in CRL parsing (transitive)
    "RUSTSEC-2026-0099",  # rustls-webpki (transitive)
    "RUSTSEC-2026-0104",  # rustls-webpki (transitive)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Allow our own crate (AGPL-3.0-only) — we control this code
[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "agave"

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip-tree = [
    # tokenizers uses an older version of serde_json
    { crate = "serde_json@>=1.0.100, <1.0.120" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
